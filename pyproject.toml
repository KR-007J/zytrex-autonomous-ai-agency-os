[project]
name = "leadforge"
version = "2.0.0"
description = "LeadForge — God-Tier Enterprise Lead Intelligence SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
