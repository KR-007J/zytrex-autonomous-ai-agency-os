[project]
name = "leadgen-outreach-agent"
version = "1.0.0"
description = "Enterprise Lead Generation and LinkedIn Outreach Agent with Hermes Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
